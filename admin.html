
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Pulse | Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">skill<span>pulse</span></a>
    <span class="admin-label">ADMIN PORTAL</span>
  </header>

  <main class="page">
    <section id="loginPanel" class="login-card">
      <p class="eyebrow">SKILL PULSE</p>
      <h1>Admin Login</h1>
      <p class="muted">Sign in to view website enquiries.</p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username"
          autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
          autocomplete="current-password" required>

        <button class="primary-button" type="submit">Sign In</button>
        <p id="loginStatus" class="status" role="status"></p>
      </form>
    </section>

    <section id="dashboardPanel" hidden>
      <div class="page-heading">
        <div>
          <p class="eyebrow">OVERVIEW</p>
          <h1>Enquiries Dashboard</h1>
          <p class="muted">Manage enquiries submitted through Skill Pulse.</p>
        </div>
        <button id="logoutButton" class="secondary-button">Log Out</button>
      </div>

      <div class="summary-card">
        <span class="muted">Total Enquiries</span>
        <strong id="totalCount">0</strong>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="search"
          placeholder="Search enquiries..."
          aria-label="Search enquiries">
        <button id="refreshButton" class="secondary-button">Refresh</button>
      </div>

      <p id="dashboardStatus" class="status" role="status"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Program</th>
              <th>Message</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="enquiriesTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    © <span id="year"></span> Skill Pulse Admin Portal
  </footer>
</body>
</html>
